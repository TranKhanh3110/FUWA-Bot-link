<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FUWA3e — Trợ lý tài liệu</title>
<style>
  :root{
    --leaf-900:#1F3A24;
    --leaf-700:#3F6C4C;
    --leaf-500:#6E9B72;
    --leaf-100:#E7EFE3;
    --cream:#F7F4EA;
    --card:#FFFFFF;
    --tangerine-600:#D9691F;
    --tangerine-500:#E7873A;
    --ink:#20281F;
    --ink-soft:#66705F;
    --hairline:#DFDACB;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    height:100vh;
    background:var(--card);
    box-shadow:0 0 40px rgba(31,58,36,0.08);
  }
  header{
    padding:18px 20px 16px;
    background:linear-gradient(135deg,var(--leaf-900),var(--leaf-700));
    color:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px;
    top:-30px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(231,135,58,0.35),transparent 70%);
  }
  .mark{
    width:42px;height:42px;border-radius:12px;
    background:var(--tangerine-500);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;color:#2a1500;
    flex-shrink:0;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .htext{position:relative; z-index:1;}
  .htext .name{font-weight:700; font-size:16.5px; letter-spacing:0.2px;}
  .htext .sub{font-size:12.5px; opacity:0.85; margin-top:2px;}

  .chips-bar{
    display:flex;
    gap:8px;
    padding:12px 16px;
    overflow-x:auto;
    background:var(--leaf-100);
    border-bottom:1px solid var(--hairline);
  }
  .chip{
    flex-shrink:0;
    padding:7px 13px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--hairline);
    font-size:12.5px;
    color:var(--leaf-700);
    cursor:pointer;
    white-space:nowrap;
    font-weight:600;
    transition:transform .12s ease, background .12s ease;
  }
  .chip:hover{ background:var(--leaf-700); color:#fff; transform:translateY(-1px); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{ display:flex; gap:9px; max-width:100%; }
  .msg.user{ flex-direction:row-reverse; }
  .avatar{
    width:28px;height:28px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px; font-weight:700;
  }
  .avatar.bot{ background:var(--leaf-100); color:var(--leaf-700); }
  .avatar.user{ background:var(--tangerine-500); color:#2a1500; }

  .bubble{
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.5;
    max-width:78%;
  }
  .msg.bot .bubble{
    background:var(--leaf-100);
    color:var(--ink);
    border-top-left-radius:4px;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--tangerine-500),var(--tangerine-600));
    color:#fff;
    border-top-right-radius:4px;
  }
  .typing{ display:flex; gap:4px; padding:4px 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--leaf-700); opacity:0.5;
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:0.4;} 30%{transform:translateY(-4px); opacity:1;} }

  .results{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:9px;
    max-width:88%;
  }
  .result-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:#fff;
    border:1px solid var(--hairline);
    border-radius:12px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .result-card:hover{ border-color:var(--leaf-500); background:var(--leaf-100); }
  .result-ico{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    background:var(--leaf-700);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .result-text{ flex:1; min-width:0; }
  .result-text .rname{ font-size:13.3px; font-weight:600; }
  .result-text .rpath{ font-size:11px; color:var(--ink-soft); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-arrow{ color:var(--leaf-500); font-size:15px; flex-shrink:0; }

  .composer{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--hairline);
    background:#fff;
  }
  .composer input{
    flex:1;
    padding:11px 14px;
    border-radius:999px;
    border:1px solid var(--hairline);
    font-size:14px;
    outline:none;
    font-family:inherit;
  }
  .composer input:focus{ border-color:var(--leaf-500); }
  .composer button{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--leaf-700);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s ease;
  }
  .composer button:hover{ background:var(--leaf-900); }
  .composer button:disabled{ background:var(--ink-soft); cursor:default; }

  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background:var(--hairline); border-radius:3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">F3</div>
    <div class="htext">
      <div class="name">FUWA3e Assistant</div>
      <div class="sub">Gửi link tài liệu &amp; hình ảnh sản phẩm từ Drive nội bộ</div>
    </div>
  </header>

  <div class="chips-bar" id="chipsBar"></div>

  <div class="messages" id="messages"></div>

  <div class="composer">
    <input id="input" type="text" placeholder="Hỏi ví dụ: cho tôi ảnh sản phẩm CarFresh…" />
    <button id="sendBtn" title="Gửi">➤</button>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById('dataset').textContent);

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const chipsBar = document.getElementById('chipsBar');

const SUGGESTIONS = [
  "Logo thương hiệu",
  "Ảnh sản phẩm CarFresh",
  "Catalogue sản phẩm",
  "Bảng giá sản phẩm",
  "Video quảng cáo",
  "Chứng nhận chất lượng",
  "Profile công ty"
];

function addSuggestionChips(list){
  chipsBar.innerHTML = "";
  list.forEach(text=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = text;
    c.onclick = () => { inputEl.value = text; sendMessage(); };
    chipsBar.appendChild(c);
  });
}
addSuggestionChips(SUGGESTIONS);

function scrollDown(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function addUserMessage(text){
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  wrap.innerHTML = `<div class="avatar user">B</div><div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(wrap);
  scrollDown();
}

function addBotTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typingMsg';
  wrap.innerHTML = `<div class="avatar bot">F</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(wrap);
  scrollDown();
}

function removeTyping(){
  const t = document.getElementById('typingMsg');
  if(t) t.remove();
}

function addBotMessage(text, items){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.innerHTML = `<div class="avatar bot">F</div>`;
  wrap.appendChild(bubble);

  if(items && items.length){
    const results = document.createElement('div');
    results.className = 'results';
    items.forEach(it=>{
      const a = document.createElement('a');
      a.className = 'result-card';
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `
        <div class="result-ico">📁</div>
        <div class="result-text">
          <div class="rname"></div>
          <div class="rpath"></div>
        </div>
        <div class="result-arrow">↗</div>
      `;
      a.querySelector('.rname').textContent = it.name;
      a.querySelector('.rpath').textContent = (it.layer1 ? it.layer1 + ' › ' : '') + (it.layer2 || '');
      results.appendChild(a);
    });
    wrap.appendChild(results);
  }
  messagesEl.appendChild(wrap);
  scrollDown();
}

function normalize(str){
  return (str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d')
    .trim();
}

// Lightweight local keyword pre-filter, used to shrink context sent to the model
function localMatch(query, limit){
  const q = normalize(query);
  const terms = q.split(/\s+/).filter(Boolean);
  if(terms.length === 0) return [];
  const totalWeight = terms.reduce((sum,t)=>sum+t.length, 0);

  const scored = DATA.map(item=>{
    const hay = normalize(`${item.layer1} ${item.layer2} ${item.name}`);
    let score = 0;
    terms.forEach(t=>{ if(hay.includes(t)) score += t.length; });
    if(hay.includes(q) && q.length>2) score += q.length * 1.5; // thưởng khi khớp nguyên cụm
    return {item, score};
  })
    // chỉ giữ kết quả khớp ĐỦ MẠNH với toàn bộ câu hỏi (>=60% trọng số từ khóa),
    // tránh tình trạng khớp lẻ tẻ 1 từ rồi trộn lẫn sản phẩm không liên quan
    .filter(s=>s.score > 0 && (s.score/totalWeight) >= 0.6)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit)
    .map(s=>s.item);
  return scored;
}

// Ban demo nay chay HOAN TOAN OFFLINE bang tim kiem tu khoa cuc bo,
// khong goi API ben ngoai, nen mo file .html nay truc tiep tren may van hoat dong binh thuong.
// Ban Zalo (server.js) moi la ban dung Claude that de hieu ngon ngu tu nhien, vi no chay
// phia server voi API key that, khong bi trinh duyet chan nhu file tinh nay.
async function askAssistant(userText){
  await new Promise(r => setTimeout(r, 350)); // hieu ung "dang go..."

  const candidates = localMatch(userText, 5);

  if(candidates.length === 0){
    return {
      reply: `Mình chưa tìm thấy mục nào khớp với "${userText}". Bạn thử mô tả cụ thể hơn nhé — ví dụ dòng sản phẩm (Homecare/CarFresh/Babycare/Refill) hoặc loại tài liệu (logo, ảnh, catalogue, video, bảng giá, chứng nhận...).`,
      items: []
    };
  }

  return {
    reply: `Mình tìm thấy ${candidates.length} mục phù hợp với "${userText}":`,
    items: candidates
  };
}

let busy = false;
async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  addUserMessage(text);
  addBotTyping();
  try{
    const result = await askAssistant(text);
    removeTyping();
    addBotMessage(result.reply || '', result.items || []);
  }catch(err){
    removeTyping();
    addBotMessage("Có lỗi khi kết nối trợ lý, bạn thử lại sau ít phút nhé.", []);
    console.error(err);
  }
  busy = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e=>{ if(e.key === 'Enter') sendMessage(); });

// Greeting
addBotMessage("Chào bạn! Mình là trợ lý tài liệu của FUWA3e 🍍. Bạn cần link logo, ảnh sản phẩm, catalogue, bảng giá hay chứng nhận nào, cứ nhắn cho mình nhé!", []);
</script>
